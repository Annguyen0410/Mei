<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Mei</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="That page is not part of the Mei website." />
    <link rel="icon" href="./icon.png" sizes="any" />
    <!-- Self-contained on purpose: a 404 is served from an arbitrary path, so it
         must not depend on the hashed asset URLs of the build. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f3ea;
        --ink: #302d27;
        --muted: #6b6459;
        --line: #ded3c0;
        --accent: #d9a94f;
        --on-accent: #171a1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171410;
          --ink: #f2ebdf;
          --muted: #b9ae9d;
          --line: #342c22;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        padding: 32px;
      }
      main { max-width: 56ch; display: grid; gap: 14px; justify-items: start; }
      img { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); }
      p.kicker { margin: 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
      h1 {
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        font-weight: 400;
        font-size: clamp(1.9rem, 4vw, 2.7rem);
        line-height: 1.05;
        margin: 0;
      }
      p { margin: 0; color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
      a {
        display: inline-flex;
        padding: 12px 22px;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid var(--line);
        color: inherit;
      }
      a.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon.png" alt="" width="48" height="48" />
      <p class="kicker">404</p>
      <h1>This page went back to the shelf.</h1>
      <p>The Mei website has a home page, a download section and documentation. This is none of those.</p>
      <div class="row">
        <a class="primary" href="/">Back to the home page</a>
        <a href="https://github.com/Annguyen0410/Mei">GitHub</a>
      </div>
    </main>
  </body>
</html>
