[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mei"
version = "1.0.1.0"
description = "Mei — Qt WebEngine desktop browser with Personal and AI hubs"
readme = "README.md"
requires-python = ">=3.10"
# The engine is a product decision, not a resolver outcome. A plain
# ``pip install .`` used to pull PyQt5/Qt 5.15 — Chromium 87 — while the shipped
# .exe was built on PyQt6/Qt 6.11 — Chromium 140. Two engines meant two very
# different browser behaviours, and the old one is refused by modern sites.
# Production is Qt 6.11 only; see
# docs/audit/MEI_BROWSER_COMPATIBILITY_MATRIX.md.
dependencies = [
    "PyQt6==6.11.0",
    "PyQt6-WebEngine==6.11.0",
    "cryptography>=41",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# LEGACY, not a supported engine. PyQt5 pins Qt 5.15 = Chromium 87, which most
# of the modern web treats as unsupported (sign-in, WebAuthn, many JS APIs).
# Kept only so an old checkout can still run its test suite; never ship it and
# never advertise it as an install path.
qt5 = ["PyQt5>=5.15", "PyQtWebEngine>=5.15"]
# Compatibility alias for the old extra name.
qt6 = ["PyQt6==6.11.0", "PyQt6-WebEngine==6.11.0"]
# Packaging is the other half of the engine: 6.19.0 is what the shipped .exe is
# built with and what the Qt 6.11 spike proved still packages the engine. Bump
# it in its own commit, never in the same one as Qt, or a broken exe has two
# possible causes.
build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["litebrowser*"]

# The chain manifest ships with the code so dev and a packaged build read the
# same project chain (see litebrowser/core/app_paths.py).
[tool.setuptools.package-data]
litebrowser = ["data/*.json", "data/plugins/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
