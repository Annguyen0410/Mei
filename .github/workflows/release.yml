name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: the workflow only needs to read the tree until the publish
# step, which needs to write the release. Keep the default read-only.
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish ${{ github.ref_name }}
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      # Pinned to the v5/v6 commit, not a moving major tag: a release job can
      # publish artefacts, so the action it runs must not change underneath it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and test dependencies
        shell: pwsh
        run: >-
          python -m pip install --upgrade pip
          "PyQt6==6.11.0" "PyQt6-WebEngine==6.11.0"
          "cryptography>=41" "segno>=1.6.0" "pytest>=7.0"
          "ruff>=0.5" "pyinstaller==6.19.0"

      - name: Lint source
        run: python -m ruff check --select F401,F811,F841,F821 litebrowser tests tools

      - name: Engine security version
        # The same gate as ci.yml, run again here: a release tag can point at a
        # commit whose ordinary CI run was green on a different engine, and the
        # security version (not the Chromium base) is what decides how much of
        # Qt's patch stream ships. Below the floor or unknown -> no build.
        run: python tools/check_engine_security.py

      - name: Check daytime theme behavior
        run: python tools/run_at_hour.py 10

      - name: Check nighttime theme behavior
        run: python tools/run_at_hour.py 22

      - name: Run test suite
        run: python -m pytest -p no:cacheprovider --no-header -q

      - name: Build shared assets
        run: python tools/build_shared_assets.py

      - name: Build Windows application
        shell: pwsh
        run: |
          $icon = (Resolve-Path "icon.ico").Path
          $iconPng = (Resolve-Path "icon.png").Path
          $chain = (Resolve-Path "litebrowser/data/chain.json").Path
          $plugins = (Resolve-Path "litebrowser/data/plugins").Path
          $webApp = (Resolve-Path "web_support/boitoan").Path
          python -m PyInstaller --onefile --noconfirm --windowed `
            --icon="$icon" --name=Mei `
            --distpath dist --workpath build/release --specpath build/release `
            --add-data "$iconPng;." `
            --add-data "$chain;litebrowser/data" `
            --add-data "$plugins;litebrowser/data/plugins" `
            --add-data "$webApp;web_support/boitoan" `
            --collect-all cryptography --collect-all segno `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --collect-all PyQt6.QtWebChannel `
            --exclude-module PyQt5 --clean browser.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      # The app ships as Mei.exe; people should not have to know that, extract a
      # companion archive and place it themselves. installer.iss already describes
      # the layout, and Inno Setup is free — the missing piece was a build step.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found; cannot build MeiSetup.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/MeiSetup.exe")) { throw "installer.iss produced no dist/MeiSetup.exe" }
          "Built dist/MeiSetup.exe"

      # Authenticode is not a substitute for the update-manifest signature: it
      # proves the publisher to Windows, while the Ed25519 manifest signature
      # proves it to Mei. Both are needed.
      #
      # Since the 2026 CA/B Forum baseline requirements a code-signing private key
      # must live in FIPS hardware and a certificate is valid for at most ~459
      # days, so CAs no longer issue exportable .pfx files. The previous step
      # wrote a PFX from a secret and passed /f /p to signtool: that cannot be
      # provisioned any more, and because `secrets` is not available in a step
      # `if:`, it silently never ran even when a PFX was configured.
      #
      # Configure a cloud-HSM provider instead (vars.MEI_SIGNING_PROVIDER):
      #   secrets AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
      #   vars    MEI_TS_ENDPOINT / MEI_TS_ACCOUNT / MEI_TS_PROFILE
      # With no provider the step says so and the stable-release gate below still
      # refuses to publish. Mei never generates a fake certificate to look signed.
      - name: Sign the executables (Authenticode, cloud HSM)
        if: ${{ vars.MEI_SIGNING_PROVIDER == 'azure-trusted-signing' }}
        # Pinned to the commit behind v0 (v0.5.11) rather than the moving major
        # tag: this action holds the cloud-signing credentials, so what runs in
        # this job must not change underneath a tag.
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293  # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.MEI_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.MEI_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.MEI_TS_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Record signing status
        shell: pwsh
        env:
          MEI_SIGNING_PROVIDER: ${{ vars.MEI_SIGNING_PROVIDER }}
        run: |
          if ($env:MEI_SIGNING_PROVIDER -ne "azure-trusted-signing") {
            "Authenticode: no signing provider configured (unsigned build)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            foreach ($file in @("dist/Mei.exe", "dist/MeiSetup.exe")) {
              if (-not (Test-Path $file)) { throw "$file is missing" }
              $sig = Get-AuthenticodeSignature $file
              if (-not $sig.SignerCertificate) { throw "$file has no Authenticode signer" }
              if ($sig.Status -ne "Valid") { throw "$file signature is not valid: $($sig.Status)" }
              if (-not $sig.TimeStamperCertificate) { throw "$file is not timestamped" }
              "Authenticode: $file signed and timestamped" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      # A stable release must never be published unsigned. Pre-releases may be
      # unsigned so maintainers can test the pipeline without a certificate;
      # ordinary releases are blocked before the publish step instead.
      - name: Require Authenticode for stable release
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          foreach ($file in @("dist/Mei.exe", "dist/MeiSetup.exe")) {
            $sig = Get-AuthenticodeSignature $file
            if (-not $sig.SignerCertificate) { throw "Stable release has no Authenticode signer for $file" }
            if ($sig.Status -ne "Valid") { throw "$file signature is not valid: $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { throw "Stable release is not timestamped ($file)" }
          }
          "Authenticode: stable signing verified for Mei.exe and MeiSetup.exe" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Record packaged artifact hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/Mei.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "dist/Mei.exe").Length
          "Mei.exe: $size bytes, sha256 $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $setupHash = (Get-FileHash "dist/MeiSetup.exe" -Algorithm SHA256).Hash.ToLower()
          $setupSize = (Get-Item "dist/MeiSetup.exe").Length
          "MeiSetup.exe: $setupSize bytes, sha256 $setupHash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Smoke-test the packaged application
        shell: pwsh
        # A successful PyInstaller exit only proves the bundle was written. This
        # launches the frozen build against a throwaway data root and waits for
        # the marker main.py writes after both windows are shown, then requires
        # a clean exit. A GUI/installer test still needs a real desktop.
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mei-release-smoke"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:LITEBROWSER_DATA_DIR = $root
          $env:MEI_SMOKE_MARKER = Join-Path $root "ready.txt"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu --disable-software-rasterizer"
          $process = Start-Process -FilePath "dist/Mei.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged smoke test did not exit within 120 seconds"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test exited $($process.ExitCode)" }
          if (-not (Test-Path $env:MEI_SMOKE_MARKER)) { throw "Packaged smoke test never reported ready" }
          "Packaged smoke test passed: $((Get-Content $env:MEI_SMOKE_MARKER -Raw).Trim())"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEI_UPDATE_KEY_ID: ${{ secrets.MEI_UPDATE_KEY_ID }}
          MEI_UPDATE_SIGNING_KEY: ${{ secrets.MEI_UPDATE_SIGNING_KEY }}
        run: |
          $releaseArgs = @(
            "tools/publish_release.py",
            "--tag", $env:GITHUB_REF_NAME,
            "--exe", "dist/Mei.exe",
            "--installer", "dist/MeiSetup.exe",
            "--web-support", "web_support"
          )
          if ($env:GITHUB_REF_NAME -match "-") { $releaseArgs += "--prerelease" }
          python @releaseArgs
